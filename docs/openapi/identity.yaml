openapi: 3.0.3
info:
  title: CO-SYNC Identity API
  version: 0.3.0
  description: |
    สัญญา API ของ identity-service
    Frontend เรียกผ่าน Gateway ที่ /api/... เสมอ
    Login สำเร็จแล้ว identity จะตั้ง cookie `access_token` (HttpOnly, JWT HS512, อายุ 12 ชั่วโมง) ให้เอง

    **สิทธิ์:** endpoint ที่มี `x-permission` ต้องเป็นพนักงานที่ role มีสิทธิ์นั้น ไม่มีจะได้ 403
    สิทธิ์ถูกฝังใน token ตอน login ถ้า Admin เปลี่ยน role หรือสิทธิ์ จะมีผลเมื่อพนักงานคนนั้น login ใหม่

    **เปลี่ยนจาก 0.1.0**
    - เพิ่ม `POST /auth/resend-otp` และ `PUT /auth/staff/password`
    - `POST /admin/employees` ส่งรหัสผ่านชั่วคราวทางอีเมล (แทนลิงก์ตั้งรหัส)
    - ระบุ error code ครบทุก endpoint ที่ทำแล้ว
    - `Role.employeeCount` ยังไม่ได้ทำ (ไม่มีใน response)
servers:
  - url: http://localhost:8080/api
    description: ผ่าน Gateway (docker compose)

tags:
  - name: auth
  - name: me
  - name: admin
  - name: internal
    description: ให้ service อื่นเรียกภายใน docker network เท่านั้น Gateway ไม่เปิดให้ภายนอก

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: สมัครสมาชิก (F2 ขั้น 1) ระบบส่ง OTP ไปทางอีเมล
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: สร้างบัญชีแล้ว รอยืนยัน OTP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: อีเมลหรือเบอร์ซ้ำ (code = EMAIL_TAKEN หรือ PHONE_TAKEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/verify-otp:
    post:
      tags: [auth]
      summary: ยืนยันอีเมลด้วย OTP (F2 ขั้น 2-3)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyOtpRequest' }
      responses:
        '204': { description: ยืนยันแล้ว เข้าสู่ระบบได้ }
        '400':
          description: |
            OTP ผิด หมดอายุ หรือผิดเกิน 5 ครั้ง (code = OTP_INVALID, OTP_EXPIRED, OTP_LOCKED)
            ไม่พบอีเมลก็ได้ OTP_INVALID เหมือนกัน หรือข้อมูลผิดรูปแบบ (code = VALIDATION_FAILED)
            ถ้าได้ OTP_EXPIRED หรือ OTP_LOCKED ให้เรียก /auth/resend-otp
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: |
            สร้าง Wallet ไม่สำเร็จ (code = WALLET_UNAVAILABLE) การยืนยันถูกยกเลิกทั้งหมด
            อีเมลยังไม่ถูกยืนยัน OTP ยังใช้ได้ ให้ผู้ใช้กดยืนยันด้วยรหัสเดิมอีกครั้ง
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/resend-otp:
    post:
      tags: [auth]
      summary: ขอ OTP ใหม่ (F2)
      description: |
        ใช้เมื่อ OTP หมดอายุหรือกรอกผิดจนถูกล็อก OTP ใหม่ใช้ได้ทันที OTP เก่าจะใช้ไม่ได้อีก
        ตอบ 204 เสมอ แม้ไม่พบอีเมลหรืออีเมลยืนยันไปแล้ว (ไม่บอกว่าอีเมลนี้มีในระบบหรือไม่)
        ขอใหม่ได้ทุก 60 วินาที
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResendOtpRequest' }
      responses:
        '204': { description: ถ้ามีบัญชีที่ยังไม่ยืนยัน ระบบส่ง OTP ใหม่ไปที่อีเมลแล้ว }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429':
          description: ขอถี่เกินไป (code = OTP_COOLDOWN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      tags: [auth]
      summary: สมาชิกเข้าสู่ระบบ
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: สำเร็จ และตั้ง cookie access_token
          headers:
            Set-Cookie:
              schema: { type: string, example: 'access_token=eyJ...; Path=/; HttpOnly; SameSite=Lax' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401':
          description: |
            อีเมลหรือรหัสผ่านผิด (code = BAD_CREDENTIALS)
            ยังไม่ยืนยันอีเมล (code = EMAIL_NOT_VERIFIED) หรือบัญชีถูกระงับ (code = ACCOUNT_SUSPENDED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/staff/login:
    post:
      tags: [auth]
      summary: พนักงานเข้าสู่ระบบ (หลังบ้าน, Counter, Kiosk)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: สำเร็จ และตั้ง cookie access_token ที่มี permission อยู่ข้างใน
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffMe' }
        '401':
          description: code = BAD_CREDENTIALS หรือ ACCOUNT_SUSPENDED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/staff/password:
    put:
      tags: [auth]
      summary: พนักงานเปลี่ยนรหัสผ่านของตัวเอง
      description: |
        พนักงานทุก role ใช้ได้ สมาชิกเรียกจะได้ 403
        token เดิมยังใช้ได้จนหมดอายุ ไม่ต้อง login ใหม่ทันที
      x-staff-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: เปลี่ยนแล้ว }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: รหัสปัจจุบันผิด (code = CURRENT_PASSWORD_INCORRECT) หรือรหัสใหม่เหมือนเดิม (code = SAME_PASSWORD)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    post:
      tags: [auth]
      summary: ออกจากระบบ (ล้าง cookie)
      responses:
        '204': { description: ออกแล้ว }

  /me:
    get:
      tags: [me]
      summary: ข้อมูลของสมาชิกที่ login อยู่
      description: สำหรับสมาชิกเท่านั้น พนักงานเรียกจะได้ 403
      x-member-only: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/qr-secret:
    get:
      tags: [me]
      summary: secret สำหรับสร้าง QR ที่เปลี่ยนทุก 60 วินาทีในเบราว์เซอร์ (Sprint 4)
      description: |
        หน้า "QR ของฉัน" สร้าง QR เองด้วยหลักการ TOTP (RFC 6238, SHA-1, 6 หลัก, step 60 วินาที)
        ข้อความใน QR = `CS1.<userId>.<totp>` เช่น `CS1.123.482913`
        ไม่มีข้อมูลส่วนตัวใน QR และภาพที่แคปไว้ใช้ไม่ได้หลังผ่านไป 60 วินาที
      x-sprint: 4
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  secretBase32: { type: string, example: JBSWY3DPEHPK3PXP }
                  stepSeconds: { type: integer, example: 60 }
                  digits: { type: integer, example: 6 }
                  prefix: { type: string, example: 'CS1' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/permissions:
    get:
      tags: [admin]
      summary: permission ทั้งหมด (ใช้ทำตาราง checkbox ในหน้า Role)
      x-permission: role.manage
      x-sprint: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Permission' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/roles:
    get:
      tags: [admin]
      summary: Role ทั้งหมดพร้อม permission
      x-permission: role.manage
      x-sprint: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      summary: สร้าง Role
      x-permission: role.manage
      x-sprint: 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '201':
          description: สร้างแล้ว
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: ชื่อซ้ำ (code = ROLE_NAME_TAKEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: มี code ของสิทธิ์ที่ไม่มีอยู่ในระบบ (code = PERMISSION_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/roles/{roleId}:
    put:
      tags: [admin]
      summary: แก้ชื่อและ permission ของ Role (มีผลกับพนักงานตอน login ครั้งถัดไป)
      x-permission: role.manage
      x-sprint: 1
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: ไม่พบ role (code = ROLE_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: ชื่อซ้ำกับ role อื่น (code = ROLE_NAME_TAKEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: มี code ของสิทธิ์ที่ไม่มีอยู่ในระบบ (code = PERMISSION_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/employees:
    get:
      tags: [admin]
      summary: รายชื่อพนักงาน
      x-permission: employee.manage
      x-sprint: 1
      parameters:
        - name: status
          in: query
          description: ไม่ใส่ = ทั้งหมด เรียงตาม employeeId
          schema: { type: string, enum: [ACTIVE, SUSPENDED] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Employee' }
        '400':
          description: ค่า status ไม่ถูกต้อง (code = VALIDATION_FAILED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      summary: เพิ่มพนักงาน (F1 ขั้น 1)
      description: |
        ระบบสุ่มรหัสผ่านชั่วคราว 12 ตัวแล้วส่งไปที่อีเมลของพนักงาน Admin ไม่เห็นรหัสนี้
        พนักงานควรเปลี่ยนรหัสด้วย PUT /auth/staff/password หลัง login ครั้งแรก
        พนักงานใหม่มีสถานะ ACTIVE เสมอ
      x-permission: employee.manage
      x-sprint: 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeInput' }
      responses:
        '201':
          description: สร้างแล้ว
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: อีเมลซ้ำ (code = EMAIL_TAKEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: roleId ไม่มีอยู่จริง (code = ROLE_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/employees/{employeeId}:
    put:
      tags: [admin]
      summary: แก้ข้อมูล เปลี่ยน Role หรือระงับพนักงาน
      description: |
        ส่งข้อมูลครบทุกช่อง (แทนที่ทั้งก้อน) ไม่ส่ง status = คงสถานะเดิม
        แก้ชื่อหรือเบอร์ของตัวเองได้ แต่เปลี่ยน role หรือระงับบัญชีตัวเองไม่ได้
        พนักงานที่ถูกระงับจะ login ไม่ได้ (ACCOUNT_SUSPENDED) ส่วน token เดิมยังใช้ได้จนหมดอายุ
      x-sprint: 1
      parameters:
        - name: employeeId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/EmployeeInput'
                - type: object
                  properties:
                    status: { type: string, enum: [ACTIVE, SUSPENDED] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: ไม่พบพนักงาน (code = EMPLOYEE_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: อีเมลซ้ำกับพนักงานคนอื่น (code = EMAIL_TAKEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: roleId ไม่มีอยู่จริง (code = ROLE_NOT_FOUND) หรือเปลี่ยน role / ระงับตัวเอง (code = CANNOT_MODIFY_SELF)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /internal/qr/resolve:
    post:
      tags: [internal]
      summary: แปลงข้อความใน QR เป็นผู้ใช้ (booking-service เรียกตอนสแกนที่ Kiosk และ Counter)
      description: ตรวจ TOTP โดยยอมรับรหัสของช่วงก่อนหน้า 1 ช่วง กันกรณีนาฬิกามือถือคลาดเล็กน้อย
      security: []
      x-sprint: 4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr]
              properties:
                qr: { type: string, example: CS1.123.482913 }
      responses:
        '200':
          description: QR ถูกต้อง
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSummary' }
        '404':
          description: รูปแบบผิด หมดอายุ หรือผู้ใช้ถูกระงับ (code = QR_INVALID)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /internal/users/by-email:
    get:
      tags: [internal]
      summary: หาสมาชิกจากอีเมล (booking-service ใช้ตอนเชิญผู้ร่วมใช้)
      security: []
      x-sprint: 3
      parameters:
        - name: email
          in: query
          required: true
          schema: { type: string, format: email }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSummary' }
        '404':
          description: code = USER_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /internal/users:
    get:
      tags: [internal]
      summary: ข้อมูลสรุปของสมาชิกหลายคนในครั้งเดียว (ใช้แสดงชื่อในรายการจองและรายงาน)
      security: []
      x-sprint: 3
      parameters:
        - name: ids
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            items: { type: integer, format: int64 }
          example: [123, 124]
      responses:
        '200':
          description: คืนเฉพาะ id ที่พบ
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserSummary' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token

  responses:
    Unauthorized:
      description: ไม่ได้ login หรือ token หมดอายุ (code = UNAUTHORIZED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: login แล้วแต่ไม่มีสิทธิ์ (code = FORBIDDEN)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: ข้อมูลไม่ครบหรือรูปแบบผิด (code = VALIDATION_FAILED) details บอกว่าช่องไหนผิด
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: VALIDATION_FAILED
            message: ข้อมูลไม่ถูกต้อง
            details: { email: ต้องเป็นอีเมล, password: ต้องยาวอย่างน้อย 8 ตัว }

  schemas:
    Error:
      description: รูปแบบ error เดียวกันทุก service
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: EMAIL_TAKEN }
        message: { type: string, example: อีเมลนี้ถูกใช้สมัครแล้ว }
        details:
          type: object
          additionalProperties: { type: string }

    RegisterRequest:
      type: object
      required: [firstName, lastName, email, phone, password, acceptTerms]
      properties:
        firstName: { type: string, maxLength: 60, example: นันท์นภัส }
        lastName: { type: string, maxLength: 60, example: ภาคภูมิ }
        email: { type: string, format: email, example: nannapat@example.com }
        phone: { type: string, pattern: '^0[0-9]{9}$', example: '0806062300' }
        password: { type: string, minLength: 8, maxLength: 72, example: 'P@ssw0rd123' }
        acceptTerms: { type: boolean, example: true }

    RegisterResponse:
      type: object
      properties:
        userId: { type: integer, format: int64, example: 123 }
        otpExpiresAt: { type: string, format: date-time }

    VerifyOtpRequest:
      type: object
      required: [email, otp]
      properties:
        email: { type: string, format: email }
        otp: { type: string, pattern: '^[0-9]{6}$', example: '482913' }

    ResendOtpRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 120, example: nannapat@example.com }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8, maxLength: 72 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    Me:
      type: object
      properties:
        userId: { type: integer, format: int64, example: 123 }
        displayId: { type: string, example: U-000123 }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: string }

    StaffMe:
      type: object
      properties:
        employeeId: { type: integer, format: int64, example: 7 }
        displayId: { type: string, example: STF-007 }
        firstName: { type: string }
        role: { type: string, example: Counter }
        permissions:
          type: array
          items: { type: string }
          example: [loan.record, checkout.override]

    UserSummary:
      type: object
      properties:
        userId: { type: integer, format: int64, example: 123 }
        displayId: { type: string, example: U-000123 }
        firstName: { type: string }
        lastName: { type: string }

    Permission:
      type: object
      properties:
        code: { type: string, example: loan.record }
        name: { type: string, example: Record equipment loans }

    RoleInput:
      type: object
      required: [name, permissions]
      properties:
        name: { type: string, maxLength: 60, example: Shift Lead }
        permissions:
          type: array
          description: code ของสิทธิ์ ส่ง [] ได้ถ้ายังไม่ให้สิทธิ์อะไร
          items: { type: string }
          example: [loan.record, checkout.override]

    Role:
      allOf:
        - type: object
          properties:
            roleId: { type: integer, format: int64 }
        - $ref: '#/components/schemas/RoleInput'

    EmployeeInput:
      type: object
      required: [firstName, lastName, email, roleId]
      properties:
        firstName: { type: string, maxLength: 60 }
        lastName: { type: string, maxLength: 60 }
        email: { type: string, format: email, maxLength: 120 }
        phone: { type: string, pattern: '^0[0-9]{9}$', description: ไม่บังคับ }
        roleId: { type: integer, format: int64 }

    Employee:
      type: object
      properties:
        employeeId: { type: integer, format: int64 }
        displayId: { type: string, example: STF-005 }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: string, nullable: true }
        roleId: { type: integer, format: int64 }
        roleName: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }

security:
  - cookieAuth: []