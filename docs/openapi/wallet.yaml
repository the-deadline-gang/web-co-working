openapi: 3.0.3
info:
  title: CO-SYNC Wallet API
  version: 0.2.0
  description: |
    สัญญา API ของ wallet-service (Sprint 2) อ้างอิงกฎ BR-01 ถึง BR-07 และ flow F3 ในเอกสาร System Flow v2

    **ข้อตกลง**
    - หน่วยเงินทุกช่องเป็น Token (number ทศนิยม 2 ตำแหน่ง) ยกเว้น `amountThb`
    - `x-permission` = permission code ที่พนักงานต้องมี ถ้าไม่ระบุแปลว่าเป็น endpoint ของสมาชิก
    - path ที่ขึ้นต้นด้วย `/internal` ให้ service อื่นเรียกภายใน docker network เท่านั้น Gateway ไม่เปิดให้ภายนอก
    - endpoint ภายในที่เปลี่ยนยอดเงินต้องส่ง header `Idempotency-Key` เสมอ
    - endpoint `/internal/**` ทุกตัวต้องส่ง header `X-Internal-Token` (= INTERNAL_API_TOKEN ใน .env) ไม่ตรงได้ 401
      Gateway ไม่ route `/internal/**` และลบ header นี้ทิ้งจาก request ภายนอก
servers:
  - url: http://localhost:8080/api
    description: ผ่าน Gateway (frontend)
  - url: http://wallet-service:8082
    description: ภายใน docker network (service อื่นเรียก /internal)

tags:
  - name: wallet
  - name: topup
  - name: webhook
  - name: admin
  - name: internal

paths:
  /me/wallet:
    get:
      tags: [wallet]
      summary: ยอด Wallet ของสมาชิก
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: สมาชิกยังไม่มี Wallet (code = WALLET_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me/wallet/transactions:
    get:
      tags: [wallet]
      summary: ประวัติการเคลื่อนไหวของ Wallet (หน้า Wallet)
      parameters:
        - name: type
          in: query
          description: กรองตามประเภท ไม่ส่ง = ทั้งหมด
          schema: { $ref: '#/components/schemas/TransactionType' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: เรียงใหม่สุดก่อน
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPage' }
        '400':
          description: ค่า type ไม่อยู่ใน enum (code = VALIDATION_FAILED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: สมาชิกยังไม่มี Wallet (code = WALLET_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /topups/config:
    get:
      tags: [topup]
      summary: ค่าตั้งค่าการเติมเงินที่หน้าเติมเงินต้องใช้ (BR-01, BR-02)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopupConfig' }

  /topups:
    post:
      tags: [topup]
      summary: สร้างรายการเติมเงินและ PromptPay QR (F3 ขั้น 1-2)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTopupRequest' }
      responses:
        '201':
          description: สร้างแล้ว สถานะ PENDING ให้แสดง QR และ poll GET /topups/{topupId} ทุก 3 วินาที
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topup' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: สมาชิกยังไม่มี Wallet (code = WALLET_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: ยอดต่ำกว่าขั้นต่ำหรือเกินสูงสุดตาม wallet_setting (code = TOPUP_AMOUNT_OUT_OF_RANGE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: TOPUP_AMOUNT_OUT_OF_RANGE
                message: เติมได้ตั้งแต่ 100 ถึง 10,000 บาท
        '502':
          description: Payment Gateway ไม่ตอบ (code = PAYMENT_GATEWAY_UNAVAILABLE) เกิดได้เฉพาะ provider = omise
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /topups/{topupId}:
    get:
      tags: [topup]
      summary: สถานะรายการเติมเงิน (หน้ารอผลใช้ poll)
      parameters:
        - $ref: '#/components/parameters/TopupId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: ไม่พบรายการ หรือเป็นของสมาชิกคนอื่น (code = TOPUP_NOT_FOUND) ตอบ 404 ทั้งสองกรณีเพื่อไม่ให้รู้ว่ามี id นี้อยู่
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /webhooks/payment:
    post:
      tags: [webhook]
      summary: Payment Gateway แจ้งผลการชำระ (F3 ขั้น 4, BR-04, BR-05)
      description: |
        ไม่ต้องมี JWT แต่ต้องตรวจลายเซ็นใน header ทุกครั้ง
        ถ้าได้รับ event ของ `gatewayRef` เดิมซ้ำ ให้ตอบ 200 โดยไม่เติมเงินซ้ำ
        รูปแบบ body ขึ้นกับ `app.payment.provider`
        - `mock`: body ตาม `PaymentWebhook` ด้านล่าง ตรวจ HMAC-SHA256 ของ raw body ใน `X-Signature`
        - `omise`: body เป็น event ของ Omise (`charge.complete`) ไม่มี `X-Signature` ระบบจะไม่เชื่อ body
          แต่เรียก `GET https://api.omise.co/charges/{id}` ถามสถานะจริงก่อนเติมเงิน
      security: []
      parameters:
        - name: X-Signature
          in: header
          required: false
          description: HMAC-SHA256 (hex) ของ raw body ด้วย PAYMENT_WEBHOOK_SECRET บังคับเมื่อ provider = mock
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentWebhook' }
      responses:
        '200': { description: รับแล้ว (รวมถึงกรณี event ซ้ำ) }
        '401':
          description: ลายเซ็นไม่ถูกต้อง (code = INVALID_SIGNATURE) ยอดไม่เปลี่ยน
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/wallet-settings:
    get:
      tags: [admin]
      summary: ค่าตั้งค่า Wallet ทั้งหมด
      x-permission: setting.manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletSettings' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [admin]
      summary: แก้ค่าตั้งค่า Wallet (ฝ่ายการเงิน)
      x-permission: setting.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalletSettings' }
      responses:
        '200':
          description: บันทึกแล้ว
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletSettings' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/topups:
    get:
      tags: [admin]
      summary: รายการเติมเงินสำหรับกระทบยอดกับ Gateway
      x-permission: report.view
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TopupStatus' }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopupPage' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/reports/revenue:
    get:
      tags: [admin]
      summary: รายได้รายวันแยกตามประเภทรายการ (P12)
      x-permission: report.view
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevenueReport' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /internal/wallets:
    post:
      tags: [internal]
      summary: สร้าง Wallet ยอด 0 ให้สมาชิกใหม่ (identity-service เรียกหลังยืนยัน OTP)
      description: เรียกซ้ำด้วย userId เดิมได้ จะคืน Wallet เดิม
      security: []
      parameters:
        - $ref: '#/components/parameters/InternalToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: integer, format: int64 }
      responses:
        '200':
          description: สร้างแล้ว หรือมีอยู่แล้ว
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/InvalidInternalToken' }

  /internal/wallets/{userId}/debit:
    post:
      tags: [internal]
      summary: ตัดเงิน (booking-service เรียกตอนชำระการจองและตอนยืมอุปกรณ์)
      description: |
        ตรวจยอดและตัดในทรานแซกชันเดียวกัน (BR-06) และสร้าง wallet_transaction 1 แถว (BR-07)
        ส่ง `Idempotency-Key` เดิมซ้ำด้วย body เดิม จะได้ผลเดิมกลับมาโดยไม่ตัดซ้ำ
      security: []
      parameters:
        - $ref: '#/components/parameters/InternalToken'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoneyMoveRequest' }
            example: { amount: 240, type: BOOKING, refType: BOOKING, refId: 192, note: B-ROOM-02 14:00-16:00 }
      responses:
        '200':
          description: ตัดแล้ว (หรือเคยตัดด้วย key นี้แล้ว)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '422':
          description: ยอดไม่พอ (code = INSUFFICIENT_BALANCE) details.shortfall = จำนวนที่ขาด
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: INSUFFICIENT_BALANCE
                message: ยอด Wallet ไม่พอ
                details: { balance: '150.00', shortfall: '90.00' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/InvalidInternalToken' }

  /internal/wallets/{userId}/credit:
    post:
      tags: [internal]
      summary: คืนเงิน (ยกเลิกการจอง, คืนเงินประกัน)
      security: []
      parameters:
        - $ref: '#/components/parameters/InternalToken'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoneyMoveRequest' }
            example: { amount: 120, type: REFUND, refType: BOOKING, refId: 192, note: ยกเลิกก่อน 5 ชม. คืน 50% }
      responses:
        '200':
          description: คืนแล้ว (หรือเคยคืนด้วย key นี้แล้ว)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/InvalidInternalToken' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token

  parameters:
    TopupId:
      name: topupId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    InternalToken:
      name: X-Internal-Token
      in: header
      required: true
      description: ความลับที่ใช้ร่วมกันระหว่าง service (INTERNAL_API_TOKEN)
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'รูปแบบ `<refType>-<refId>-<action>` เช่น booking-192-pay, loan-55-deposit-refund'
      schema: { type: string, maxLength: 100, example: booking-192-pay }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: เกิน 100 จะถูกปรับเป็น 100, น้อยกว่า 1 ถูกปรับเป็น 1
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    From:
      name: from
      in: query
      required: true
      schema: { type: string, format: date, example: '2026-11-01' }
    To:
      name: to
      in: query
      required: true
      schema: { type: string, format: date, example: '2026-11-30' }

  responses:
    InvalidInternalToken:
      description: ไม่มีหรือไม่ตรง X-Internal-Token (code = INVALID_INTERNAL_TOKEN)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: ไม่ได้ login (code = UNAUTHORIZED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: ไม่มีสิทธิ์ (code = FORBIDDEN)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: ไม่พบข้อมูล หรือไม่ใช่ของผู้ใช้คนนี้ (code ขึ้นกับ resource เช่น WALLET_NOT_FOUND, TOPUP_NOT_FOUND)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: ข้อมูลไม่ถูกต้อง (code = VALIDATION_FAILED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    IdempotencyConflict:
      description: ใช้ Idempotency-Key เดิมแต่ body ต่างไป (code = IDEMPOTENCY_CONFLICT)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: object
          additionalProperties: { type: string }

    Money:
      type: number
      format: double
      description: Token ทศนิยม 2 ตำแหน่ง
      example: 240.00

    Wallet:
      type: object
      properties:
        walletId: { type: integer, format: int64, example: 18 }
        displayId: { type: string, example: W-000018 }
        balance: { $ref: '#/components/schemas/Money' }

    TransactionType:
      type: string
      enum: [TOPUP, BOOKING, REFUND, LOAN_FEE, DEPOSIT_HOLD, DEPOSIT_REFUND]

    Transaction:
      type: object
      properties:
        txnId: { type: integer, format: int64, example: 901 }
        type: { $ref: '#/components/schemas/TransactionType' }
        amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: บวก = เงินเข้า, ลบ = เงินออก
          example: -240.00
        balanceAfter: { $ref: '#/components/schemas/Money' }
        refType: { type: string, enum: [TOPUP, BOOKING, LOAN] }
        refId: { type: integer, format: int64, example: 192 }
        note: { type: string, example: B-ROOM-02 14:00-16:00 }
        createdAt: { type: string, format: date-time }

    TransactionPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }

    MoneyMoveRequest:
      type: object
      required: [amount, type, refType, refId]
      properties:
        amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: ส่งเป็นค่าบวกเสมอ ระบบกำหนดเครื่องหมายเองตาม endpoint
        type:
          type: string
          enum: [BOOKING, REFUND, LOAN_FEE, DEPOSIT_HOLD, DEPOSIT_REFUND]
        refType: { type: string, enum: [BOOKING, LOAN] }
        refId: { type: integer, format: int64 }
        note: { type: string, maxLength: 200 }

    TopupConfig:
      type: object
      properties:
        rate: { type: number, example: 1, description: 1 บาท ได้กี่ Token }
        minThb: { type: integer, example: 100 }
        maxThb: { type: integer, example: 10000 }
        quickAmounts:
          type: array
          items: { type: integer }
          example: [100, 200, 500, 1000, 2000]
        qrExpireMinutes: { type: integer, example: 15 }

    WalletSettings:
      type: object
      required: [rate, minThb, maxThb, qrExpireMinutes]
      properties:
        rate: { type: number, minimum: 0.01, example: 1 }
        minThb: { type: integer, minimum: 1, example: 100 }
        maxThb: { type: integer, minimum: 1, example: 10000 }
        qrExpireMinutes: { type: integer, minimum: 1, maximum: 60, example: 15 }
        updatedBy: { type: string, readOnly: true, example: STF-004 }
        updatedAt: { type: string, format: date-time, readOnly: true }

    CreateTopupRequest:
      type: object
      required: [amountThb]
      properties:
        amountThb: { type: integer, example: 500 }
        returnToBookingId:
          type: integer
          format: int64
          description: ส่งมาเมื่อกดเติมเงินจากหน้าจองที่ยอดไม่พอ (BR-17) เติมสำเร็จแล้ว frontend พากลับไปหน้าชำระการจองนี้

    TopupStatus:
      type: string
      enum: [PENDING, PAID, EXPIRED, FAILED]

    Topup:
      type: object
      properties:
        topupId: { type: integer, format: int64, example: 87 }
        displayId: { type: string, example: PAY-20261102-0087 }
        amountThb: { type: integer, example: 500 }
        tokenAmount: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/TopupStatus' }
        qrImage:
          type: string
          description: |
            รูป PromptPay QR ใส่ใน `<img src>` ได้เลย มีค่าเฉพาะตอน PENDING
            - provider = mock: data URL (`data:image/png;base64,...`)
            - provider = omise: https URL ของ Omise (redirect ไปไฟล์ SVG)
          example: data:image/png;base64,iVBORw0KGgo...
        expiresAt: { type: string, format: date-time }
        paidAt: { type: string, format: date-time, nullable: true }
        balanceAfter:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          nullable: true
          description: มีค่าเมื่อ PAID
        returnToBookingId: { type: integer, format: int64, nullable: true }

    TopupPage:
      type: object
      properties:
        items:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Topup'
              - type: object
                properties:
                  userDisplayId: { type: string, example: U-000123 }
                  gatewayRef: { type: string, example: chrg_test_5xyz }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }

    PaymentWebhook:
      type: object
      required: [eventId, gatewayRef, status, amountThb]
      properties:
        eventId: { type: string, example: evt_test_5abc }
        gatewayRef: { type: string, example: chrg_test_5xyz }
        status: { type: string, enum: [successful, failed] }
        amountThb: { type: integer, example: 500 }
        paidAt: { type: string, format: date-time }

    RevenueReport:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        days:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              topup: { $ref: '#/components/schemas/Money' }
              booking: { $ref: '#/components/schemas/Money' }
              refund: { $ref: '#/components/schemas/Money' }
