spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:mysql://localhost:3307/identity_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: cosync
    password: cosync
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: localhost
    port: 1025

server:
  port: 8081

app:
  otp:
    ttl-minutes: 10
    max-attempts: 5
  jwt:
    secret: ${JWT_SECRET}
    ttl-hours: 12