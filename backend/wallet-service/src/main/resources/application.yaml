spring:
  application:
    name: wallet-service
  datasource:
    url: jdbc:mysql://localhost:3307/wallet_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: cosync
    password: cosync
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8082

app:
  payment:
    provider: ${PAYMENT_PROVIDER:mock}
    promptpay-id: ${PROMPTPAY_ID:0812345678}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET}
    omise:
      secret-key: ${OMISE_SECRET_KEY:}
  internal:
    token: ${INTERNAL_API_TOKEN}
 
   