spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**, /api/me
              filters:
                - StripPrefix=1

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}