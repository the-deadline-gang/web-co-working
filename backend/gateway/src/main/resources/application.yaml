spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**,/api/me,/api/admin/roles/**,/api/admin/permissions,/api/admin/employees/**
              filters:
                - StripPrefix=1

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}