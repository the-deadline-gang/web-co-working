services:

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: cosync
      MYSQL_PASSWORD: cosync
    ports:
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
   
  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"     # port ที่ Spring ส่งอีเมลเข้ามา
      - "8025:8025"     # หน้าเว็บสำหรับดูอีเมล

volumes:
  mysqldata: