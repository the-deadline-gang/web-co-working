services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: cosync
      MYSQL_PASSWORD: cosync
    ports:
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  mysqldata: